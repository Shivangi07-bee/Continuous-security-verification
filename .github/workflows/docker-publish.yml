name: Build and Publish ShopEasy Lite

on:
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./shopeasy-lite
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/shopeasy-lite:latest
            ghcr.io/${{ github.repository_owner }}/shopeasy-lite:v1
