name: Continuous Security Verification

on:
  workflow_call:

jobs:
  security-verification:

    name: Repository Security Verification

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      # --------------------------------------------------
      # 1. Checkout the repository that called this workflow
      # --------------------------------------------------

      - name: Checkout target repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0


      # --------------------------------------------------
      # 2. Setup Python
      # --------------------------------------------------

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"


      # --------------------------------------------------
      # 3. Checkout our verification framework
      # --------------------------------------------------

      - name: Checkout security verification framework
        uses: actions/checkout@v5
        with:
          repository: Shivangi07-bee/Continuous-security-verification
          ref: main
          path: security-verification-framework


      # --------------------------------------------------
      # 4. Identify repository evolution
      # --------------------------------------------------

      - name: Determine commits
        id: commits
        shell: bash
        run: |

          CURRENT_COMMIT="${GITHUB_SHA}"

          if [ "${GITHUB_EVENT_NAME}" = "pull_request" ]; then

            BASE_COMMIT="${{ github.event.pull_request.base.sha }}"

          elif [ "${GITHUB_EVENT_BEFORE}" != "0000000000000000000000000000000000000000" ]; then

            BASE_COMMIT="${GITHUB_EVENT_BEFORE}"

          else

            BASE_COMMIT="$(git rev-list --max-parents=0 HEAD)"

          fi

          echo "base=${BASE_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "head=${CURRENT_COMMIT}" >> "$GITHUB_OUTPUT"

          echo "BASE: ${BASE_COMMIT}"
          echo "HEAD: ${CURRENT_COMMIT}"


      # --------------------------------------------------
      # 5. Run our complete verification pipeline
      # --------------------------------------------------

      - name: Run continuous security verification
        shell: bash
        run: |

          python security-verification-framework/engine/pipeline.py \
            --repo "${GITHUB_WORKSPACE}" \
            --base "${{ steps.commits.outputs.base }}" \
            --head "${{ steps.commits.outputs.head }}"


      # --------------------------------------------------
      # 6. Display verification result
      # --------------------------------------------------

- name: Display security result
   shell: bash
   run: |

          echo ""
          echo "=============================================="
          echo "CONTINUOUS SECURITY VERIFICATION RESULT"
          echo "=============================================="

          python - <<'PY'

          import json
          from pathlib import Path

          path = Path(
              "security-verification-framework/output/security_rule_report.json"
          )

          if not path.exists():
              print("Security report was not generated.")
              raise SystemExit(1)

          report = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          print(
              f"Total checks : {report.get('total_checks', 0)}"
          )

          print(
              f"PASS         : {report.get('passed', 0)}"
          )

          print(
              f"FAIL         : {report.get('failed', 0)}"
          )

          print(
              f"REVIEW       : {report.get('review_required', 0)}"
          )

          PY

 - name: Enforce security gate
   shell: bash
   run: |

    python - <<'PY'

          import json
          from pathlib import Path

          path = Path(
              "security-verification-framework/output/security_rule_report.json"
          )

          report = json.loads(
              path.read_text(
                  encoding="utf-8"
              )
          )

          failed = report.get("failed", 0)

          if failed > 0:
              print(
                  f"SECURITY GATE: FAILED ({failed} regression(s))"
              )
              raise SystemExit(1)

          print("SECURITY GATE: PASSED")

          PY


      # --------------------------------------------------
      # 7. Preserve reports as CI artifacts
      # --------------------------------------------------

      - name: Upload verification reports
        uses: actions/upload-artifact@v5
        with:

          name: security-verification-reports

          path: |
            security-verification-framework/output/*.json